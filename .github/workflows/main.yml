name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o kids_world_studio_flutter.zip -d project
          find project -name pubspec.yaml

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find project -name pubspec.yaml | head -1)")
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-world-studio-apk
          path: project/**/build/app/outputs/flutter-apk/app-release.apk
