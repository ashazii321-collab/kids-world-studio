
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract Flutter project
        run: |
          unzip -o kids-world-studio-flutter.zip -d source

      - name: Find Flutter project
        run: |
          PROJECT_DIR=$(find source -name pubspec.yaml -printf '%h\n' | head -1)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Create fresh Android project
        run: |
          flutter create --platforms=android kids_world_app

      - name: Copy app files
        run: |
          cp -r "$PROJECT_DIR/lib" kids_world_app/
          cp "$PROJECT_DIR/pubspec.yaml" kids_world_app/

          if [ -d "$PROJECT_DIR/assets" ]; then
            cp -r "$PROJECT_DIR/assets" kids_world_app/
          fi

      - name: Build APK
        run: |
          cd kids_world_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-world-studio-apk
          path: kids_world_app/build/app/outputs/flutter-apk/app-release.apk
