
name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Find and Extract Flutter project
        run: |
          mkdir -p source

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            find . -maxdepth 2 -type f
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          unzip -o "$ZIP_FILE" -d source

          PUBSPEC=$(find source -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found"
            find source -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $PROJECT_DIR"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Create fresh Android project
        run: |
          flutter create --platforms=android kids_world_app

      - name: Copy Flutter app
        run: |
          cp "$PROJECT_DIR/pubspec.yaml" kids_world_app/
          cp -r "$PROJECT_DIR/lib" kids_world_app/

          if [ -d "$PROJECT_DIR/assets" ]; then
            cp -r "$PROJECT_DIR/assets" kids_world_app/
          fi

      - name: Build APK
        run: |
          cd kids_world_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kids-world-studio-apk
          path: kids_world_app/build/app/outputs/flutter-apk/app-release.apk
